<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C313C" />
      <stop offset="100%" stop-color="#181A1F" />
    </linearGradient>
    <linearGradient id="mic-grad-idle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F5E75" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg-grad)" stroke="#3F4452" stroke-width="2" />

  <g opacity="0.35">
    <!-- 极宽U型托架：半径85，描边18 -->
    <path d="M 43 145 A 85 85 0 0 0 213 145" fill="none" stroke="#475569" stroke-width="18" stroke-linecap="round" />
    <!-- 极限拾音头：110x165 -->
    <rect x="73" y="55" width="110" height="165" rx="55" fill="url(#mic-grad-idle)" />
    <!-- 加宽的纹理 -->
    <line x1="100" y1="100" x2="156" y2="100" stroke="#1E293B" stroke-width="10" stroke-linecap="round" />
    <line x1="100" y1="135" x2="156" y2="135" stroke="#1E293B" stroke-width="10" stroke-linecap="round" />
    <line x1="100" y1="170" x2="156" y2="170" stroke="#1E293B" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
