<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C313C" />
      <stop offset="100%" stop-color="#181A1F" />
    </linearGradient>
    
    <!-- 拾音头保持银色金属感，区别于推流态 -->
    <linearGradient id="mic-grad-conn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- 托架专用的连接绿渐变 -->
    <linearGradient id="bracket-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <!-- 为支架增加微弱的发光效果 -->
    <filter id="bracket-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg-grad)" stroke="#3F4452" stroke-width="2" />

  <g filter="url(#drop-shadow)">
    <!-- 底部托架：改为绿色渐变并增加微弱发光 -->
    <path d="M 43 145 A 85 85 0 0 0 213 145" fill="none" stroke="url(#bracket-green)" stroke-width="18" stroke-linecap="round" filter="url(#bracket-glow)" />
    
    <!-- 巨大化拾音头：保持金属色 -->
    <rect x="73" y="55" width="110" height="165" rx="55" fill="url(#mic-grad-conn)" />
    
    <!-- 内部纹理 -->
    <line x1="100" y1="100" x2="156" y2="100" stroke="#475569" stroke-width="10" stroke-linecap="round" opacity="0.6" />
    <line x1="100" y1="135" x2="156" y2="135" stroke="#475569" stroke-width="10" stroke-linecap="round" opacity="0.6" />
    <line x1="100" y1="170" x2="156" y2="170" stroke="#475569" stroke-width="10" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 顶部状态指示灯 -->
  <circle cx="212" cy="48" r="16" fill="#10B981" />
</svg>
